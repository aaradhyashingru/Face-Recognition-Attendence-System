version: "3.9"

services:
  # FRAS Enterprise Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fras_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # Uncomment when using PostgreSQL service below:
    # depends_on:
    #   db:
    #     condition: service_healthy

