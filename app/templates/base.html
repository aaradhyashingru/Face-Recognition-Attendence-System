<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FRAS Enterprise — Face Recognition Attendance System{% endblock %}</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  
  <!-- Neomorphism CSS -->
  <link rel="stylesheet" href="/static/css/neomorphism.css">
  
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  <header class="neo-nav">
    <a href="/kiosk" class="neo-logo">
      <div class="neo-logo-icon">
        <i data-feather="camera"></i>
      </div>
      <span>FRAS <span style="color: var(--primary);">ENTERPRISE</span></span>
    </a>

    <!-- Center Clock -->
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="neo-card-inset" style="padding: 6px 18px; border-radius: var(--radius-full); font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">
        <i data-feather="calendar" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;"></i>
        <span>{{ today_date }}</span>
        <span style="margin: 0 8px; opacity: 0.4;">|</span>
        <span id="nav-digital-clock" style="color: var(--primary); font-family: monospace; font-size: 1rem; font-weight: 700;">--:--:--</span>
      </div>
    </div>

    <!-- Navigation Links -->
    <nav style="display: flex; align-items: center; gap: 12px;">
      <a href="/kiosk" class="neo-btn {% if request.url.path == '/kiosk' %}active{% endif %}">
        <i data-feather="video"></i> Kiosk Mode
      </a>
      
      {% if current_user and current_user.role == 'ADMIN' %}
      <a href="/admin" class="neo-btn {% if request.url.path == '/admin' %}active{% endif %}">
        <i data-feather="grid"></i> Dashboard
      </a>
      <a href="/admin/users" class="neo-btn {% if request.url.path == '/admin/users' %}active{% endif %}">
        <i data-feather="users"></i> Users
      </a>
      <a href="/admin/reports" class="neo-btn {% if request.url.path == '/admin/reports' %}active{% endif %}">
        <i data-feather="file-text"></i> Reports
      </a>
      <button onclick="logoutAdmin()" class="neo-btn neo-btn-danger" style="padding: 10px 18px;">
        <i data-feather="log-out"></i>
      </button>
      {% else %}
      <a href="/login" class="neo-btn neo-btn-primary">
        <i data-feather="lock"></i> Admin Login
      </a>
      {% endif %}
    </nav>
  </header>

  <!-- Main Content Container -->
  <main style="flex: 1; padding: 24px 32px;">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast Message Container -->
  <div id="toast-container"></div>

  <script>
    // Initialize Feather Icons
    feather.replace();

    // Digital Clock
    function updateClock() {
      const now = new Date();
      const clockEl = document.getElementById('nav-digital-clock');
      if (clockEl) {
        clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: true });
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Show Neomorphic Toast
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'neo-toast';
      
      let icon = 'info';
      let color = 'var(--info)';
      if (type === 'success') { icon = 'check-circle'; color = 'var(--success)'; }
      if (type === 'danger') { icon = 'alert-triangle'; color = 'var(--danger)'; }
      if (type === 'warning') { icon = 'alert-circle'; color = 'var(--warning)'; }

      toast.innerHTML = `
        <div style="color: ${color}; display: flex; align-items: center;">
          <i data-feather="${icon}"></i>
        </div>
        <div style="font-weight: 600; font-size: 0.95rem;">${message}</div>
      `;
      container.appendChild(toast);
      feather.replace();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Logout
    async function logoutAdmin() {
      try {
        await fetch('/api/v1/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (e) {
        window.location.href = '/login';
      }
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
