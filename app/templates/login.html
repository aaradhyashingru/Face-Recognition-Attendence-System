{% extends "base.html" %}

{% block title %}Admin Login — FRAS Enterprise{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center;">
  
  <div class="neo-card" style="width: 100%; max-width: 440px; padding: 40px 36px; text-align: center;">
    
    <!-- Logo Symbol -->
    <div class="neo-card" style="width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: var(--primary);">
      <i data-feather="shield" style="width: 36px; height: 36px;"></i>
    </div>

    <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">
      Admin Portal
    </h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; margin-bottom: 28px;">
      Enter your credentials to access the biometric management and reporting portal.
    </p>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 18px; text-align: left;">
      
      <div>
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">
          USERNAME / ADMIN CODE
        </label>
        <input type="text" id="username" class="neo-input" placeholder="e.g. admin" required autofocus>
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">
          PASSWORD
        </label>
        <input type="password" id="password" class="neo-input" placeholder="••••••••" required>
      </div>

      <button type="submit" id="login-btn" class="neo-btn neo-btn-primary" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 1rem;">
        <i data-feather="log-in"></i> Sign In to Dashboard
      </button>

      <div class="neo-card-inset" style="padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        <span>Default Credentials: <b>admin</b> / <b>admin123</b></span>
      </div>

    </form>

  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<i data-feather="loader" style="animation: spin 1.5s linear infinite;"></i> Authenticating...';
    feather.replace();

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || 'Login failed');
      }

      showToast(`Welcome back, ${data.full_name}!`, 'success');
      setTimeout(() => {
        window.location.href = '/admin';
      }, 600);
    } catch (err) {
      showToast(err.message, 'danger');
      btn.disabled = false;
      btn.innerHTML = '<i data-feather="log-in"></i> Sign In to Dashboard';
      feather.replace();
    }
  }
</script>
<style>
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
{% endblock %}
